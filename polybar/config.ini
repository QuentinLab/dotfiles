[colors]
rosewater = #f5e0dc
flamingo = #f2cdcd
pink = #f5c2e7
mauve = #cba6f7
red = #f38ba8
maroon = #eba0ac
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe
text = #cdd6f4
subtext1 = #bac2de
subtext0 = #a6adc8
overlay2 = #9399b2
overlay1 = #7f849c
overlay0 = #6c7086
surface2 = #585b70
surface1 = #45475a
surface0 = #313244
base = #1e1e2e
mantle = #181825
crust = #11111b
transparent = #00000000

[bar/example]
width = 98%
offset-x = 1%
offset-y = 5
height = 29
fixed-center = true
bottom = false


background = ${colors.base}
foreground = ${colors.text}

line-size = 2pt
line-color = ${colors.blue}

border-size = 0
border-color = ${colors.transparent}

padding-left = 1
padding-right = 1

module-margin-left = 1
module-margin-right = 1

#separator = |
#separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font Mono:style=Bold:size=10;3"
font-1 = "JetBrainsMono Nerd Font Mono:size=12;3"
font-2 = "JetBrainsMono Nerd Font Mono:size=17;4"
font-3 = "JetBrainsMono Nerd Font Mono:size=20;4"

modules-left = rofi point i3 point xwindow point player-mpris-tail
modules-center = point date point
modules-right = system-bluetooth-bluetoothctl point eth point pulseaudio point memory point cpu point tray point powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
override-redirect = true
wm-restack = i3

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

; --- FOCUSED WORKSPACE (Active) ---

label-focused = "%{T3}%{F#313244}%{F-}%{T-}%{B#313244}%{F#cba6f7} %name% %{F-}%{B-}%{T3}%{F#313244}%{F-}%{T-}"
label-focused-background = ${colors.base}
label-focused-padding = 0

; --- UNFOCUSED WORKSPACE (Inactive) ---
label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.overlay1}

; --- URGENT WORKSPACE (Alert) ---
label-urgent = "%{T3}%{F#f38ba8}%{F-}%{T-}%{B#f38ba8}%{F#1e1e2e} %name% %{F-}%{B-}%{T3}%{F#f38ba8}%{F-}%{T-}"
label-urgent-background = ${colors.base}
label-urgent-foreground = ${colors.red}
label-urgent-padding = 0

; --- VISIBLE WORKSPACE ---
label-visible = %name%
label-visible-padding = 1
label-visible-foreground = ${colors.text}

[module/rofi]
type = custom/text

content = "%{T3}%{F#313244}%{F-}%{T-}%{B#313244}%{F#cba6f7}%{T4}  %{T-}%{F-}%{B-}%{T3}%{F#313244}%{F-}%{T-}"



click-left = rofi -show drun -show-icons

[module/point]
type = custom/text
content = 
content-foreground = ${colors.surface1}
content-font = 1
content-padding = 1
content-margin = 0

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d-%m-%Y %H:%M:%S
label = %date%
label-foreground = ${colors.text}
format-prefix = "  "
format-prefix-foreground = ${colors.teal}


[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.teal}

[module/player-mpris-tail]
type = custom/script
label-foreground = ${colors.lavender}
exec = ~/.config/polybar/player-mpris-tail/player-mpris-tail.py -f '%{T3}%{A1:i3-msg [class='Spotify'] focus:}%{A}%{T1} {artist} - {title}'
;exec = ~/.config/polybar/player-mpris-tail/player-mpris-tail.py -f '%{T3}%{T1} {artist} - {title}'
tail = true
click-left = ~/.config/polybar/player-mpris-tail/player-mpris-tail.py previous &
click-right = ~/.config/polybar/player-mpris-tail/player-mpris-tail.py next &
click-middle = ~/.config/polybar/player-mpris-tail/player-mpris-tail.py play-pause &

[module/system-bluetooth-bluetoothctl]
type = custom/script
label-foreground = ${colors.rosewater}
format = <label>
exec = ~/.config/polybar/system-bluetooth-bluetoothctl/system-bluetooth-bluetoothctl.sh
tail = true
click-left = ~/.config/polybar/system-bluetooth-bluetoothctl/system-bluetooth-bluetoothctl.sh --toggle &

[module/tray]
type = internal/tray

format-margin = 8px
tray-spacing = 8px

[module/pulseaudio]
type = internal/pulseaudio
format-volume = %{T3}<ramp-volume> %{T1}<label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.text}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}
label-muted = %{T3}󰝟%{T1} Muted
label-muted-foreground = ${colors.overlay0}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{A1:alacritty -e btop:}%{T3}%{T1} %{A}"
format-prefix-foreground = ${colors.peach}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{A1:alacritty -e btop:}%{T3}%{T1} %{A} "
format-prefix-foreground = ${colors.red}
label = %percentage:2%%

[module/powermenu]
type = custom/text
label = "%{T2} " 
label-foreground = ${colors.red}
click-left = ~/code/tools/dotfiles/rofi/powermenu.sh

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%
label-disconnected = %{F#F0C674}%ifname%%{F#707880} 󰈁disconnected

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{A1:nm-connection-editor:}%{T2}󰈁 %{T1}%downspeed% %{A}
label-disconnected = %{A1:nm-connection-editor:} %{F#F0C674}%ifname%%{F#707880} %{T3}󰈂%% {A}


[module/xwindow]
type = internal/xwindow
label = %class%
label-maxlen = 60
label-foreground = ${colors.mauve}
label-background = ${colors.base}
label-padding = 0
label-margin = 0
label-empty = No Window Focus
label-empty-foreground = ${colors.mauve}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
